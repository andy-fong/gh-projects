[package]
name = "gh-projects-web"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
dioxus-free-icons = { version = "0.10", features = ["lucide"] }
hadrone-dioxus = "0.1"
hadrone-core = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", features = ["http"] }
gloo-storage = "0.3"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Storage",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "DomRect",
    "Event",
    "EventTarget",
    "MouseEvent",
    "DataTransfer",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "Navigator",
    "Clipboard",
] }

[profile.release]
opt-level = "s"
